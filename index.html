<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q版人物梗圖庫 | 主題相簿與下載</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-amber-50/40 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- 頂部導覽列 -->
  <header class="bg-white/80 backdrop-blur border-b border-amber-100 sticky top-0 z-30">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-2 cursor-pointer" onclick="goToHome()">
        <span class="text-2xl">✨</span>
        <span class="font-black text-xl text-amber-600 tracking-tight">Q版人物梗圖庫</span>
      </div>
      <div class="flex items-center gap-2">
        <button id="exportDataBtn" onclick="exportCurrentData()" class="inline-flex items-center space-x-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 px-3.5 py-2 rounded-2xl text-xs font-bold transition" title="複製目前所有資料，貼回程式碼即可讓所有人看見">
          <i data-lucide="share-2" class="w-3.5 h-3.5"></i>
          <span>匯出公開資料</span>
        </button>
        <button id="openCreateFolderBtn" class="inline-flex items-center space-x-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-2xl text-sm font-bold transition shadow-sm">
          <i data-lucide="folder-plus" class="w-4 h-4"></i>
          <span>新增主題資料夾</span>
        </button>
      </div>
    </div>
  </header>

  <!-- 主內容容器 -->
  <main class="max-w-6xl mx-auto px-4 py-8 flex-1 w-full">

    <!-- 視圖 1：首頁主題資料夾列表 (Folders View) -->
    <div id="foldersView">
      <div class="text-center max-w-xl mx-auto mb-8">
        <h1 class="text-3xl sm:text-4xl font-black text-slate-900 mb-2">Q版人物梗圖主題庫</h1>
        <p class="text-slate-600 text-sm sm:text-base">選擇一個主題資料夾進入瀏覽，自由下載珍藏的 Q 版梗圖！</p>
      </div>

      <!-- 資料夾網格 -->
      <div id="foldersGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </div>

    <!-- 視圖 2：資料夾內頁 (Folder Detail View) -->
    <div id="detailView" class="hidden">
      <!-- 頂部導航與管理按鈕 -->
      <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 pb-6 border-b border-amber-200/60 mb-6">
        <div>
          <button onclick="goToHome()" class="inline-flex items-center gap-1.5 text-xs font-bold text-amber-600 hover:text-amber-700 bg-amber-100/70 hover:bg-amber-100 px-3 py-1.5 rounded-xl transition mb-3">
            <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
            <span>返回主題列表</span>
          </button>
          <div class="flex items-center gap-3">
            <img id="currentFolderThumb" src="" alt="封面" class="w-12 h-12 rounded-2xl object-cover border border-amber-200 shadow-sm">
            <div>
              <div class="flex items-center gap-2">
                <h2 id="currentFolderName" class="text-2xl font-black text-slate-900">資料夾名稱</h2>
                <button onclick="openEditCurrentFolder()" class="text-slate-400 hover:text-amber-600 p-1 transition" title="修改資料夾">
                  <i data-lucide="edit-3" class="w-4 h-4"></i>
                </button>
                <button onclick="deleteCurrentFolder()" class="text-slate-400 hover:text-rose-600 p-1 transition" title="刪除資料搞">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
              <p id="currentFolderDesc" class="text-xs text-slate-500 mt-0.5">主題說明</p>
            </div>
          </div>
        </div>

        <button onclick="openUploadImageModal()" class="inline-flex items-center gap-2 bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-2xl text-sm font-bold transition shadow-sm self-start sm:self-auto">
          <i data-lucide="image-plus" class="w-4 h-4"></i>
          <span>新增梗圖到此主題</span>
        </button>
      </div>

      <!-- 梗圖網格 -->
      <div id="imagesGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6"></div>

      <!-- 空狀態 -->
      <div id="emptyFolderState" class="hidden text-center py-16">
        <span class="text-4xl block mb-2">🖼️</span>
        <p class="text-slate-500 font-medium">這個資料夾目前還是空的，點擊右上角新增第一張圖片吧！</p>
      </div>
    </div>

  </main>

  <!-- Modal 1：新增 / 編輯資料夾彈窗 -->
  <div id="folderModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 id="folderModalTitle" class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <span>📁</span>
          <span>新增主題資料夾</span>
        </h3>
        <button onclick="closeModals()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="folderForm" class="mt-4 space-y-3.5">
        <input type="hidden" id="folderEditId" value="">
        
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">主題資料夾名稱 *</label>
          <input type="text" id="folderNameInput" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="例如：日常發瘋專區">
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">主題說明</label>
          <textarea id="folderDescInput" rows="2" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="簡單描述這個主題收錄哪種類型的梗圖..."></textarea>
        </div>

        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">上傳封面圖片 <span class="font-normal text-slate-400">(選填)</span></label>
          <input type="file" id="folderCoverInput" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
          <div id="folderCoverPreviewBox" class="mt-2 hidden items-center gap-2">
            <span class="text-xs text-slate-400">當前封面：</span>
            <img id="folderCoverPreviewImg" src="" class="w-10 h-10 rounded-lg object-cover border border-amber-200">
          </div>
        </div>

        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModals()" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-xl">取消</button>
          <button type="submit" id="folderSubmitBtn" class="px-5 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-sm">儲存資料夾</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Modal 2：上傳圖片到資料夾 -->
  <div id="uploadImageModal" class="fixed inset-0 bg-slate-900/50 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl max-w-md w-full p-6 shadow-2xl">
      <div class="flex items-center justify-between pb-3 border-b border-slate-100">
        <h3 class="font-bold text-lg text-slate-900 flex items-center gap-2">
          <span>🎨</span>
          <span>新增圖片到此主題</span>
        </h3>
        <button onclick="closeModals()" class="text-slate-400 hover:text-slate-600">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>
      <form id="uploadImageForm" class="mt-4 space-y-3.5">
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">梗圖標題 *</label>
          <input type="text" id="imageTitle" required class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="例如：週一靈魂出竅">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">備註說明</label>
          <input type="text" id="imageDesc" class="w-full px-3 py-2 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="例如：打卡後立刻趴平">
        </div>
        <div>
          <label class="block text-xs font-bold text-slate-700 mb-1">選取梗圖圖片 *</label>
          <input type="file" id="imageFileInput" accept="image/*" required class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-3 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-amber-100 file:text-amber-800 hover:file:bg-amber-200 cursor-pointer">
        </div>
        <div class="pt-2 flex justify-end gap-2">
          <button type="button" onclick="closeModals()" class="px-4 py-2 text-sm text-slate-500 hover:bg-slate-100 rounded-xl">取消</button>
          <button type="submit" class="px-5 py-2 text-sm bg-amber-500 hover:bg-amber-600 text-white font-bold rounded-xl shadow-sm">上傳儲存</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 頁尾 -->
  <footer class="bg-white border-t border-amber-100 py-6 text-center text-xs text-slate-400">
    <p>Q版人物梗圖庫 · 遵循 AGENTS.md 規範設計 · 部署於 GitHub Pages</p>
  </footer>

    let store = JSON.parse(localStorage.getItem('chibi_folder_store_git')) || initialData;
    let currentFolderId = null;

    function saveStore() {
      try {
        localStorage.setItem('chibi_folder_store_git', JSON.stringify(store));
      } catch (e) {
        console.warn("Storage quota exceeded");
      }
    }

    // 匯出目前作品資料（方便貼回 initialData）
    window.exportCurrentData = function() {
      const jsonStr = JSON.stringify(store, null, 2);
      navigator.clipboard.writeText(jsonStr).then(() => {
        alert("🎉 已將目前所有資料夾與梗圖複製到剪貼簿！\n\n你可以把這段內容直接貼到 index.html 的 initialData 裡面，推送到 GitHub，所有人打開就都會看到你的最新作品了！");
      }).catch(() => {
        prompt("請手動複製以下 JSON 資料：", jsonStr);
      });
    };

    // 渲染首頁主題資料夾
    function renderFolders() {
      const grid = document.getElementById('foldersGrid');
      grid.innerHTML = '';

      store.folders.forEach(folder => {
        const count = store.images.filter(img => img.folderId === folder.id).length;
        const card = document.createElement('div');
        card.className = "bg-white border border-amber-100 hover:border-amber-300 rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-200 flex flex-col justify-between group";

        card.innerHTML = `
          <div onclick="openFolder('${folder.id}')" class="cursor-pointer">
            <div class="w-full h-40 bg-slate-100 overflow-hidden relative">
              <img src="${folder.coverImage}" alt="${folder.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
              <span class="absolute top-3 right-3 text-xs font-bold px-2.5 py-1 rounded-full bg-white/90 backdrop-blur text-amber-800 shadow-sm">
                ${count} 張圖片
              </span>
            </div>
            <div class="p-5">
              <h3 class="font-black text-lg text-slate-900 group-hover:text-amber-600 transition-colors mb-1">
                ${folder.name}
              </h3>
              <p class="text-xs text-slate-500 line-clamp-2 leading-relaxed">
                ${folder.description || '無詳細說明'}
              </p>
            </div>
          </div>

          <div class="px-5 py-3 border-t border-slate-50 flex items-center justify-between bg-slate-50/50 text-xs">
            <button onclick="openFolder('${folder.id}')" class="font-bold text-amber-600 hover:text-amber-700 flex items-center gap-1">
              <span>進入資料夾</span>
              <i data-lucide="chevron-right" class="w-3.5 h-3.5"></i>
            </button>
            <div class="flex items-center gap-1">
              <button onclick="openEditFolder('${folder.id}')" class="p-1.5 text-slate-400 hover:text-amber-600 rounded-lg hover:bg-white transition" title="編輯資料夾">
                <i data-lucide="edit-3" class="w-3.5 h-3.5"></i>
              </button>
              <button onclick="deleteFolder('${folder.id}')" class="p-1.5 text-slate-400 hover:text-rose-600 rounded-lg hover:bg-white transition" title="刪除資料夾">
                <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
              </button>
            </div>
          </div>
        `;
        grid.appendChild(card);
      });
      lucide.createIcons();
    }

    function openFolder(folderId) {
      currentFolderId = folderId;
      const folder = store.folders.find(f => f.id === folderId);
      if (!folder) return;

      document.getElementById('foldersView').classList.add('hidden');
      document.getElementById('detailView').classList.remove('hidden');

      document.getElementById('currentFolderThumb').src = folder.coverImage;
      document.getElementById('currentFolderName').innerText = folder.name;
      document.getElementById('currentFolderDesc').innerText = folder.description || '';

      renderImages();
    }

    function goToHome() {
      currentFolderId = null;
      document.getElementById('detailView').classList.add('hidden');
      document.getElementById('foldersView').classList.remove('hidden');
      renderFolders();
    }

    function renderImages() {
      const grid = document.getElementById('imagesGrid');
      const emptyState = document.getElementById('emptyFolderState');
      grid.innerHTML = '';

      const images = store.images.filter(img => img.folderId === currentFolderId);

      if (images.length === 0) {
        emptyState.classList.remove('hidden');
      } else {
        emptyState.classList.add('hidden');
        images.forEach(img => {
          const card = document.createElement('div');
          card.className = "bg-white border border-amber-100 rounded-3xl overflow-hidden shadow-sm hover:shadow-md transition-all flex flex-col justify-between relative group";

          card.innerHTML = `
            <button onclick="deleteImage('${img.id}')" class="absolute top-2.5 right-2.5 w-7 h-7 bg-white/90 hover:bg-rose-50 text-slate-400 hover:text-rose-600 rounded-full flex items-center justify-center shadow-sm opacity-0 group-hover:opacity-100 transition" title="刪除此圖">
              <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
            </button>

            <div>
              <div class="w-full h-48 bg-slate-50 overflow-hidden flex items-center justify-center p-3">
                <img src="${img.imageUrl}" alt="${img.title}" class="max-h-full max-w-full object-contain">
              </div>
              <div class="p-4">
                <h4 class="font-extrabold text-slate-900 text-base mb-1">${img.title}</h4>
                <p class="text-xs text-slate-500">${img.description || ''}</p>
              </div>
            </div>
            <div class="px-4 pb-4 pt-2 border-t border-slate-50 flex items-center justify-between">
              <span class="text-[11px] text-slate-400 font-mono truncate max-w-[130px]">${img.downloadFilename}</span>
              <button onclick="downloadImage('${img.id}')" class="inline-flex items-center gap-1.5 text-xs font-bold bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-1.5 rounded-xl transition shadow-sm">
                <i data-lucide="download" class="w-3.5 h-3.5"></i>
                <span>下載圖片</span>
              </button>
            </div>
          `;
          grid.appendChild(card);
        });
      }
      lucide.createIcons();
    }

    window.deleteFolder = function(folderId) {
      const folder = store.folders.find(f => f.id === folderId);
      if (!folder) return;

      if (!confirm(`確定要刪除「${folder.name}」資料夾嗎？\n⚠️ 裡面的所有梗圖圖片將會一併被移除！`)) return;

      store.folders = store.folders.filter(f => f.id !== folderId);
      store.images = store.images.filter(img => img.folderId !== folderId);
      saveStore();

      if (currentFolderId === folderId) {
        goToHome();
      } else {
        renderFolders();
      }
    };

    window.deleteCurrentFolder = function() {
      if (currentFolderId) deleteFolder(currentFolderId);
    };

    window.deleteImage = function(imgId) {
      if (!confirm("確定要刪除這張圖片嗎？")) return;
      store.images = store.images.filter(i => i.id !== imgId);
      saveStore();
      renderImages();
    };

    window.downloadImage = function(imgId) {
      const img = store.images.find(i => i.id === imgId);
      if (!img) return;

      fetch(img.imageUrl)
        .then(res => res.blob())
        .then(blob => {
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = img.downloadFilename || `${img.title}.png`;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        });
    };

    const folderModal = document.getElementById('folderModal');
    const imageModal = document.getElementById('uploadImageModal');

    document.getElementById('openCreateFolderBtn').onclick = () => {
      document.getElementById('folderEditId').value = '';
      document.getElementById('folderModalTitle').innerHTML = '<span>📁</span><span>新增主題資料夾</span>';
      document.getElementById('folderNameInput').value = '';
      document.getElementById('folderDescInput').value = '';
      document.getElementById('folderCoverInput').value = '';
      document.getElementById('folderCoverPreviewBox').classList.add('hidden');
      folderModal.classList.remove('hidden');
    };

    window.openEditFolder = function(folderId) {
      const folder = store.folders.find(f => f.id === folderId);
      if (!folder) return;

      document.getElementById('folderEditId').value = folder.id;
      document.getElementById('folderModalTitle').innerHTML = '<span>✏️</span><span>編輯主題資料夾</span>';
      document.getElementById('folderNameInput').value = folder.name;
      document.getElementById('folderDescInput').value = folder.description || '';
      document.getElementById('folderCoverInput').value = '';
      
      const previewBox = document.getElementById('folderCoverPreviewBox');
      const previewImg = document.getElementById('folderCoverPreviewImg');
      previewImg.src = folder.coverImage;
      previewBox.classList.remove('hidden');

      folderModal.classList.remove('hidden');
    };

    window.openEditCurrentFolder = function() {
      if (currentFolderId) openEditFolder(currentFolderId);
    };

    function openUploadImageModal() { imageModal.classList.remove('hidden'); }
    function closeModals() {
      folderModal.classList.add('hidden');
      imageModal.classList.add('hidden');
    }

    document.getElementById('folderForm').onsubmit = function(e) {
      e.preventDefault();
      const editId = document.getElementById('folderEditId').value;
      const name = document.getElementById('folderNameInput').value;
      const desc = document.getElementById('folderDescInput').value;
      const coverFile = document.getElementById('folderCoverInput').files[0];

      const applyFolderSave = (coverDataUrl) => {
        if (editId) {
          const folder = store.folders.find(f => f.id === editId);
          if (folder) {
            folder.name = name;
            folder.description = desc;
            if (coverDataUrl) folder.coverImage = coverDataUrl;
          }
        } else {
          const newFolder = {
            id: 'folder-' + Date.now(),
            name: name,
            description: desc,
            coverImage: coverDataUrl || getDefaultCover(name, 'FFE082')
          };
          store.folders.push(newFolder);
        }

        saveStore();
        closeModals();
        if (currentFolderId) {
          openFolder(currentFolderId);
        } else {
          renderFolders();
        }
      };

      if (coverFile) {
        const reader = new FileReader();
        reader.onload = (evt) => applyFolderSave(evt.target.result);
        reader.readAsDataURL(coverFile);
      } else {
        applyFolderSave(null);
      }
    };

    document.getElementById('uploadImageForm').onsubmit = function(e) {
      e.preventDefault();
      const fileInput = document.getElementById('imageFileInput');
      const file = fileInput.files[0];
      if (!file || !currentFolderId) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        const newImg = {
          id: 'img-' + Date.now(),
          folderId: currentFolderId,
          title: document.getElementById('imageTitle').value,
          description: document.getElementById('imageDesc').value,
          downloadFilename: file.name,
          imageUrl: evt.target.result
        };
        store.images.unshift(newImg);
        saveStore();
        closeModals();
        document.getElementById('uploadImageForm').reset();
        renderImages();
      };
      reader.readAsDataURL(file);
    };

    renderFolders();
  </script>
</body>
</html>
